<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1900" viewBox="0 0 1400 1900">
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1f2937"/></marker></defs>
  <rect width="1400" height="1900" fill="white"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111827" stroke="#1f2937" stroke-width="3">
    <!-- Initial flow -->
    <circle cx="700" cy="90" r="18" fill="#111827"/>
    <rect x="570" y="155" width="260" height="70" rx="12" fill="#f8fafc" stroke="#1f4e79"/>
    <rect x="570" y="285" width="260" height="70" rx="12" fill="#f8fafc" stroke="#1f4e79"/>
    <rect x="570" y="415" width="260" height="70" rx="12" fill="#f8fafc" stroke="#1f4e79"/>
    <rect x="520" y="545" width="360" height="70" rx="12" fill="#eaf2f8" stroke="#1f4e79"/>
    <g fill="none" stroke="#1f2937" marker-end="url(#arrow)"><path d="M700 108 V155"/><path d="M700 225 V285"/><path d="M700 355 V415"/><path d="M700 485 V545"/></g>
    <g stroke="none" text-anchor="middle" font-size="26"><text x="700" y="199">Login</text><text x="700" y="329">Validate Credentials</text><text x="700" y="459">OTP Verification</text><text x="700" y="589">Identify User Role</text></g>

    <!-- Branch split -->
    <path d="M700 615 V680 M700 680 H260 V735 M700 680 V735 M700 680 H1140 V735" fill="none" stroke="#1f2937" marker-end="url(#arrow)"/>
    <g stroke="none" text-anchor="middle" font-size="25" font-weight="700" fill="#1f4e79"><text x="260" y="705">Admin</text><text x="700" y="705">Faculty</text><text x="1140" y="705">Verification Officer</text></g>

    <!-- Role actions -->
    <g fill="#f8fafc" stroke="#1f4e79">
      <rect x="110" y="765" width="300" height="70" rx="12"/><rect x="110" y="900" width="300" height="70" rx="12"/>
      <rect x="550" y="765" width="300" height="70" rx="12"/><rect x="550" y="900" width="300" height="70" rx="12"/><rect x="550" y="1035" width="300" height="70" rx="12"/>
      <rect x="990" y="765" width="300" height="70" rx="12"/><rect x="990" y="900" width="300" height="70" rx="12"/><rect x="990" y="1035" width="300" height="70" rx="12"/>
    </g>
    <g stroke="none" text-anchor="middle" font-size="24"><text x="260" y="809">Manage System</text><text x="260" y="944">Configure Assessment</text><text x="700" y="809">View Assigned Subjects</text><text x="700" y="944">Enter Marks</text><text x="700" y="1079">Validate</text><text x="1140" y="809">Review Assessment</text><text x="1140" y="944">Verify</text><text x="1140" y="1079">Record Status</text></g>
    <g fill="none" stroke="#1f2937" marker-end="url(#arrow)"><path d="M260 735 V765"/><path d="M260 835 V900"/><path d="M700 735 V765"/><path d="M700 835 V900"/><path d="M700 970 V1035"/><path d="M1140 735 V765"/><path d="M1140 835 V900"/><path d="M1140 970 V1035"/></g>

    <!-- Merge and final flow -->
    <path d="M260 970 V1170 H700 M700 1105 V1170 M1140 1105 V1170 H700" fill="none" stroke="#1f2937"/>
    <circle cx="700" cy="1170" r="9" fill="#1f2937"/>
    <path d="M700 1179 V1235" fill="none" stroke="#1f2937" marker-end="url(#arrow)"/>
    <g fill="#f8fafc" stroke="#1f4e79"><rect x="520" y="1235" width="360" height="70" rx="12"/><rect x="520" y="1365" width="360" height="70" rx="12"/><rect x="520" y="1495" width="360" height="70" rx="12"/><rect x="520" y="1625" width="360" height="70" rx="12"/></g>
    <g stroke="none" text-anchor="middle" font-size="26"><text x="700" y="1279">Store in Database</text><text x="700" y="1409">Process Results</text><text x="700" y="1539">Tabulation / Result</text><text x="700" y="1669">Logout</text></g>
    <g fill="none" stroke="#1f2937" marker-end="url(#arrow)"><path d="M700 1305 V1365"/><path d="M700 1435 V1495"/><path d="M700 1565 V1625"/><path d="M700 1695 V1760"/></g>
    <circle cx="700" cy="1800" r="24" fill="white" stroke="#111827" stroke-width="6"/><circle cx="700" cy="1800" r="13" fill="#111827" stroke="none"/>
    <text x="700" y="1855" text-anchor="middle" font-size="25" stroke="none">End</text>
  </g>
</svg>
