<g stroke="none" text-anchor="middle" font-size="26"><text x="750" y="808">Generate OTP</text><text x="750" y="948">Hash and Store OTP</text><text x="750" y="1088">Set Expiry Period</text><text x="750" y="1228">Send OTP through Email</text></g>
